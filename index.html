<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Varmtvann"/>
<meta name="theme-color" content="#07101e"/>
<title>Ekstra Varmtvann</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --m:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none}
html,body{
  background:#07101e;
  height:-webkit-fill-available;
  min-height:100svh;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
body{
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bot);
}

/* STATUS BAR — overlay oppå bildet */
.sbar{
  position:absolute;
  top:var(--safe-top);
  left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:.35rem .9rem;
  height:1.8rem;
  z-index:20;
  background:linear-gradient(to bottom, rgba(0,0,0,.45) 0%, transparent 100%);
}
.sdot{
  width:6px;height:6px;border-radius:50%;
  background:#2e4d6a;
  transition:background .5s,box-shadow .5s;
}
.sdot.live{background:#22c55e;box-shadow:0 0 7px #22c55e99;}
.sdot.err {background:#ef4444;box-shadow:none;}
.stxt{
  font-family:var(--m);font-size:10px;color:#2e4d6a;
  letter-spacing:.06em;transition:color .5s;
}
.stxt.live{color:#22c55e;}
.cfgbtn{
  background:none;border:none;cursor:pointer;
  color:#2e4d6a;font-size:17px;padding:2px 6px;
  line-height:1;touch-action:manipulation;
}

/* IMAGE WRAP — starter under notch/kamera-området */
.wrap{
  position:fixed;
  top:var(--safe-top);
  left:0;right:0;bottom:0;
  overflow:hidden;
}

/* Images fill wrap exactly */
.simg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  /* Vertikal forankring justerbar via --imgpos (0%=topp, 100%=bunn).
     Bildet er høyere enn skjermen, så denne styrer hvor mye som
     kuttes i topp vs bunn. */
  object-position:center var(--imgpos, 0%);
  pointer-events:none;
  /* Hysterese: fade over .6s, ingen blinking */
  transition:opacity .6s cubic-bezier(.4,0,.2,1);
}
/* Ikke-aktivert: forankret topp (overskrift synlig) */
.img-off{ --imgpos:0%; opacity:1; }
/* Aktivert: skyv bildet ned slik at den mørke stripa nederst forsvinner,
   men ikke så langt at overskriften øverst kuttes. */
.img-on{ --imgpos:78%; opacity:0; }
/* Active state — med .3s forsinkelse så bildet ikke blinker ved feil */
body.active   .img-off{opacity:0;transition-delay:.1s;}
body.active   .img-on {opacity:1;transition-delay:.1s;}
/* Reverting: rask tilbake */
body.reverting .img-off{opacity:1;transition-duration:.3s;transition-delay:0s;}
body.reverting .img-on {opacity:0;transition-duration:.3s;transition-delay:0s;}

/* TAP ZONE — JS posisjonerer */
.tapbtn{
  position:absolute;
  border-radius:50%;
  background:transparent;
  border:none;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-appearance:none;
  z-index:10;
}
.tapbtn:active{background:rgba(255,255,255,.1);}
body.loading .tapbtn{pointer-events:none;opacity:.5;}

/* TILGJENGELIG DUSJTID — JS posisjonerer under undertittel */
.avail{
  position:absolute;
  left:0;right:0;
  text-align:center;
  font-family:var(--m);
  font-size:14px;
  font-weight:500;
  letter-spacing:.02em;
  color:#9fb4c8;
  z-index:15;
  pointer-events:none;
  opacity:0;
  transition:opacity .4s,color .4s;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.avail.show{opacity:1;}
body.active .avail{color:#b7e6c0;}

/* TIMER — overlay nederst, mørk pille så den ikke kolliderer med knappen */
.tbar{
  position:absolute;
  bottom:calc(var(--safe-bot) + .15rem);
  left:0;right:0;
  height:1.6rem;
  display:flex;align-items:center;justify-content:center;
  z-index:20;
}
.ttxt{
  font-family:var(--m);font-size:12px;letter-spacing:.1em;
  color:#1e3050;opacity:0;
  padding:.25rem .9rem;border-radius:999px;
  background:transparent;
  transition:color .5s,opacity .4s,background .4s;
}
body.active .ttxt{
  color:#f97316;opacity:1;
  background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}

/* CONFIG DRAWER */
.drawer{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.78);
  display:none;align-items:flex-end;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.drawer.open{display:flex;}
.panel{
  width:100%;background:#0a1828;
  border-radius:20px 20px 0 0;
  padding:1.1rem 1.3rem calc(1.3rem + var(--safe-bot));
  border-top:1px solid rgba(255,255,255,.07);
}
.ph{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.13);margin:0 auto .85rem;}
.pt{font-size:10px;font-weight:700;font-family:var(--m);letter-spacing:.14em;text-transform:uppercase;color:#2e4d6a;margin-bottom:.85rem;}
.pconn{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.18);border-radius:11px;padding:.75rem .95rem;margin-bottom:.75rem;display:flex;align-items:center;gap:.65rem;}
.pcdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#22c55e;box-shadow:0 0 6px #22c55e88;}
.pctxt{font-family:var(--m);font-size:10px;color:#22c55e;line-height:1.5;flex:1;}
.pcsub{color:#166534;font-size:9px;display:block;}
.pcreset{background:none;border:1px solid rgba(255,255,255,.08);border-radius:7px;color:#2e4d6a;font-family:var(--m);font-size:9px;padding:.33rem .6rem;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;white-space:nowrap;flex-shrink:0;}
.pf.hidden{display:none;}
.pfield{display:flex;flex-direction:column;gap:4px;margin-bottom:.7rem;}
.plbl{font-family:var(--m);font-size:9px;color:#2e4d6a;letter-spacing:.08em;text-transform:uppercase;}
.pinp{background:#060f1c;border:1px solid rgba(255,255,255,.07);border-radius:8px;color:#e2eef8;font-family:var(--m);padding:.5rem .75rem;outline:none;width:100%;font-size:16px;transition:border-color .2s;}
.pinp:focus{border-color:rgba(45,124,246,.45);}
.pbtn{width:100%;background:rgba(45,124,246,.14);border:1px solid rgba(45,124,246,.35);border-radius:9px;color:#60a5fa;font-family:var(--m);font-size:13px;letter-spacing:.04em;padding:.65rem;cursor:pointer;margin-top:.3rem;touch-action:manipulation;-webkit-appearance:none;}
.pnote{font-family:var(--m);font-size:9px;color:#1e3050;line-height:1.6;margin-top:.6rem;}
.pnote a{color:#3a6090;text-decoration:none;}
.perr{font-family:var(--m);font-size:10px;color:#f87171;margin-top:.3rem;opacity:0;transition:opacity .3s;text-align:center;}
.perr.show{opacity:1;}
.pdump{display:none;margin-top:.55rem;background:#040c18;border:1px solid rgba(45,124,246,.13);border-radius:7px;padding:.55rem;font-family:var(--m);font-size:9px;color:#6a8fb0;max-height:150px;overflow-y:auto;word-break:break-all;line-height:1.6;}

@media(prefers-reduced-motion:reduce){.simg,.ttxt{transition:none;}}
</style>
</head>

<script>
'use strict';

/* ── STORAGE ── */
const lv = k => { try { return localStorage.getItem(k); } catch { return null; } };
const sv = (k,v) => { try { localStorage.setItem(k,v); } catch {} };

let hid   = lv('hw_hid')   || '192.168.1.200';
let hkey  = lv('hw_hkey')  || '';
let devId = lv('hw_devId') || '';
let capNm = lv('hw_cap')   || '';

const GOOD_CAP = 'hotwater_increase_NIBE.h697_onetimeincrease_hotwater';
const STATUS_CAP = 'measure_enum_NIBE.h697_onetimeincrease_hotwater';
if (capNm && capNm !== GOOD_CAP) { capNm = ''; sv('hw_cap',''); }

/* ── STATE ── */
let online  = false;
let active  = false;  // visuell tilstand
let cdInt   = null;
let cdsec   = 0;
let stateTO = null;   // hysterese-timer
const HW_VAL = '2', HW_OFF = '0', HW_SEC = 3600; // capability krever string!

/* ── PERSISTERT NEDTELLING ──
   Vi lagrer tidspunktet aktiveringen startet, slik at gjenstående tid
   beregnes på nytt når appen åpnes igjen (i stedet for å nullstilles til 1 t). */
function startCountdown() {
  sv('hw_started', String(Date.now()));
}
function clearCountdown() {
  try { localStorage.removeItem('hw_started'); } catch {}
}
function remainingSec() {
  const t = parseInt(lv('hw_started') || '', 10);
  if (!t || isNaN(t)) return HW_SEC; // ukjent start → anta full time
  const left = HW_SEC - Math.floor((Date.now() - t) / 1000);
  return left > 0 ? left : 0;
}

/* ── TAP ZONE POSITIONING ──
   Bilder: 853x1844 (off) / 852x1846 (on) — nesten identiske
   Knapp senter i bilde: ~50% horisontalt, ~72% vertikalt
   Radius: ~19% av bildebredde
   Bildene vises med object-fit:cover, object-position:center top
   → bildet er aldri letterboxed, fyller wrap alltid kant-til-kant
*/
const BTN_X = 0.50, BTN_R = 0.21;
const BTN_Y_OFF = 0.57;  // knappen i "ikke aktivert"-bildet
const BTN_Y_ON  = 0.67;  // knappen i "aktivert"-bildet
const IMG_NAT_W = 852, IMG_NAT_H = 1846;
// Plassering av dusjtid-tekst (andel av bildehøyde, rett under undertittelen)
const AVAIL_Y_OFF = 0.125;
const AVAIL_Y_ON  = 0.125;

function placeTap() {
  const wrap = document.getElementById('wrap');
  const btn  = document.getElementById('tapbtn');
  const av   = document.getElementById('avail');
  const wr   = wrap.getBoundingClientRect();

  const scale = wr.width / IMG_NAT_W;
  const rw = IMG_NAT_W * scale;
  const rh = IMG_NAT_H * scale;

  // Aktivert-bildet er forankret med object-position:center 78%, dvs. bildet
  // er forskjøvet OPP med (0.78 × overflow). Vi kompenserer knapp og tekst med
  // samme forskyvning så de følger bildet nøyaktig på alle skjermer.
  const IMG_POS_ON = 0.78; // MÅ stemme med --imgpos for .img-on i CSS
  const overflow = Math.max(0, rh - wr.height);
  const yShift = active ? -(overflow * IMG_POS_ON) : 0;

  const btnY = active ? BTN_Y_ON : BTN_Y_OFF;
  const cx = rw * BTN_X;
  const cy = rh * btnY + yShift;
  const r  = rw * BTN_R;

  btn.style.left   = (cx - r) + 'px';
  btn.style.top    = (cy - r) + 'px';
  btn.style.width  = (r * 2)  + 'px';
  btn.style.height = (r * 2)  + 'px';

  // Dusjtid-tekst
  const availY = active ? AVAIL_Y_ON : AVAIL_Y_OFF;
  av.style.top = (rh * availY + yShift) + 'px';
}

window.addEventListener('load',   placeTap, {passive:true});
window.addEventListener('resize', placeTap, {passive:true});
document.getElementById('imgOff').addEventListener('load', placeTap, {once:true});

/* ── DUSJTID-ESTIMAT ──
   Samme formel som akkumulatortank-dashboardet:
   180L tank, brukbart vann over 35°C, 4 L/min sparedusj ved 40°C (kaldt 10°C).
   Bruker snittet av tappevannssensorene. */
const TEMP_CAP_TOP = 'measure_temperature_NIBE.i8_warmwater_top'; // BT7 topp
const TEMP_CAP_HW  = 'measure_temperature_NIBE.i9_hot_water';     // BT6 charging (kontrollsensor)
const BT5_DEV_ID   = '268d71a6-f117-4f0c-860e-c37377e7d1f9';      // Nibe BT5 (DeviceCapabilities)
const BT5_CAP      = 'devicecapabilities_number.number1';          // BT5 bunn

// Nibes egen blandingsformel (reverse engineered fra myUplink + datablad):
//   usable_L = tank_vol × (T_bt6 - T_kald) / (T_dusj - T_kald)
//   minutter  = usable_L / flow_L_min
//
// Nibe bruker BT6 (charging/kontrollsensor, midt i tank) som temperaturkilde,
// 10 L/min (EN 13203 standard dusjflow) og 180 L tankvolum.
// Gir eksakt 20 min ved BT6=43.8°C — matcher Nibe sin egen app.
const HW_VOL   = 180;   // liter
const T_KALD   = 10;    // °C kaldtvann
const T_DUSJ   = 40;    // °C ønsket dusjtemperatur
const FLOW     = 10;    // L/min (EN 13203 standard)

function showerMinutes(temps) {
  const vld = temps.filter(t => t !== null && t !== undefined && !isNaN(t));
  if (!vld.length) return null;
  // Bruk BT6 (index 1) som primær — det er Nibes kontrollsensor.
  // Faller tilbake til snitt hvis BT6 mangler.
  const T = temps[1] != null && !isNaN(temps[1]) ? temps[1]
          : vld.reduce((a, b) => a + b, 0) / vld.length;
  if (T <= T_DUSJ) return 0;
  const usable = HW_VOL * (T - T_KALD) / (T_DUSJ - T_KALD);
  return Math.round(usable / FLOW);
}

function setAvail(mins) {
  const av = document.getElementById('avail');
  if (mins === null) { av.classList.remove('show'); av.textContent = ''; return; }
  av.textContent = '(' + mins + ' min Varmtvann)';
  av.classList.add('show');
}

/* Beregn gjenstående tappevann (dusjtid) på nytt — uavhengig av om ekstra
   varmtvann er aktivert. Kalles av en egen timer hvert minutt. */
async function refreshAvail() {
  if (!online || !devId) return;
  try {
    const r = await apiFetch('/api/manager/devices/device/' + devId);
    if (!r.ok) return;
    const d = await r.json();
    const caps = d.capabilitiesObj || {};
    const tTop = caps[TEMP_CAP_TOP];
    const tHw  = caps[TEMP_CAP_HW];
    let bt5 = null;
    try {
      const bt5dev = devs_cache.find(x => x.id === BT5_DEV_ID);
      const bt5cap = bt5dev?.capabilitiesObj?.[BT5_CAP];
      bt5 = (bt5cap && bt5cap.value != null) ? bt5cap.value : null;
    } catch {}
    setAvail(showerMinutes([tTop ? tTop.value : null, tHw ? tHw.value : null, bt5]));
  } catch {}
}

/* ── STATUS UI ── */
function statusLabel(sec) {
  // Statusbar-tekst for aktivert tilstand, viser gjenstående tid
  if (sec == null || sec >= HW_SEC - 60) return 'Aktivert · 1 time';
  const m = Math.max(0, Math.round(sec / 60));
  return 'Aktivert · ' + m + ' min igjen';
}
function setStatus(txt, state) {
  // state: 'live' | 'err' | null
  document.getElementById('stxt').textContent = txt;
  const dot = document.getElementById('sdot');
  const stxt = document.getElementById('stxt');
  dot.className  = 'sdot'  + (state ? ' '+state : '');
  stxt.className = 'stxt'  + (state==='live' ? ' live' : '');
}

/* ── API ── */
function base() {
  if (!hid) return null;
  const h = hid.trim();
  if (h.startsWith('http')) return h.replace(/\/$/, '');
  // Hvis ren IP: bruk Homey sin lokale HTTPS-adresse for å unngå
  // mixed-content blokkering når siden lastes over HTTPS (GitHub Pages)
  if (/^\d+\.\d+\.\d+\.\d+$/.test(h)) {
    const dashed = h.replace(/\./g, '-');
    return 'https://' + dashed + '.homey.homeylocal.com';
  }
  return 'http://' + h;
}

async function apiFetch(path, opts) {
  const b = base();
  if (!b) throw new Error('Ingen IP konfigurert');
  const ac = new AbortController();
  const t  = setTimeout(() => ac.abort(), 5000);
  try {
    const r = await fetch(b + path, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + hkey, ...(opts?.headers) },
      signal: ac.signal,
    });
    clearTimeout(t);
    return r;
  } catch(e) {
    clearTimeout(t);
    throw new Error(e.name === 'AbortError' ? 'Tidsavbrudd — er du hjemme?' : 'Ikke tilgjengelig på LAN');
  }
}

/* ── DEVICE CACHE — brukes til BT5-oppslag i readCapability ── */
let devs_cache = [];

async function getDevices() {
  if (!hkey) throw new Error('Mangler API Key');
  const r = await apiFetch('/api/manager/devices/device');
  if (r.status === 401) throw new Error('API Key ugyldig (401)');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return Object.values(await r.json());
}

async function findNibe(devs) {
  const d = devs.find(d =>
    d.name === 'Nibe S-Series' ||
    (d.name && d.name.toLowerCase().includes('nibe s'))
  );
  if (!d) throw new Error('Fant ikke Nibe S-Series i Homey');
  devId = d.id;  sv('hw_devId', devId);
  capNm = GOOD_CAP; sv('hw_cap', capNm);
  return d;
}

/* ── HOMEYSCRIPT API ── */
let scriptOnId  = lv('hw_script_on')  || '';
let scriptOffId = lv('hw_script_off') || '';
const SCRIPT_ON_NAME  = 'tappevann_paa';
const SCRIPT_OFF_NAME = 'tappevann_av';

async function findScripts() {
  const r = await apiFetch('/api/app/com.athom.homeyscript/script');
  if (r.status === 403) throw new Error('API Key mangler tilgang til HomeyScript-appen — legg til "HomeyScript" i API Key-rettigheter');
  if (!r.ok) throw new Error('Kunne ikke hente scripts (HTTP ' + r.status + ')');
  const scripts = await r.json();
  // scripts kan være objekt eller array
  const list = Array.isArray(scripts) ? scripts : Object.values(scripts);

  const norm = s => (s || '').trim().toLowerCase().replace(/\s+/g, '_');
  const on  = list.find(s => norm(s.name) === norm(SCRIPT_ON_NAME) || norm(s.id) === norm(SCRIPT_ON_NAME));
  const off = list.find(s => norm(s.name) === norm(SCRIPT_OFF_NAME) || norm(s.id) === norm(SCRIPT_OFF_NAME));

  if (!on)  throw new Error('Fant ikke script "' + SCRIPT_ON_NAME + '" i HomeyScript');
  if (!off) throw new Error('Fant ikke script "' + SCRIPT_OFF_NAME + '" i HomeyScript');

  scriptOnId  = on.id || on.name; sv('hw_script_on',  scriptOnId);
  scriptOffId = off.id || off.name; sv('hw_script_off', scriptOffId);
}

async function runScript(scriptId) {
  const r = await apiFetch(
    '/api/app/com.athom.homeyscript/script/' + encodeURIComponent(scriptId) + '/run',
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }
  );
  if (!r.ok) {
    let body = ''; try { body = await r.text(); } catch {}
    throw new Error('Script-kjøring feilet HTTP ' + r.status + ': ' + body.slice(0, 60));
  }
}

async function readCapability() {
  // Les pumpens faktiske status (measure_enum), ikke den skrivbare triggeren
  // Den skrivbare nullstilles til 0 etter at engangskommandoen er sendt
  const r = await apiFetch('/api/manager/devices/device/' + devId);
  if (!r.ok) return null;
  const d = await r.json();
  const caps = d.capabilitiesObj || {};
  // Oppdater dusjtid samtidig (sparer et ekstra kall)
  const tTop = caps[TEMP_CAP_TOP];
  const tHw  = caps[TEMP_CAP_HW];
  // BT5 ligger på egen DeviceCapabilities-enhet
  let bt5 = null;
  try {
    const bt5dev = devs_cache.find(d => d.id === BT5_DEV_ID);
    const bt5cap = bt5dev?.capabilitiesObj?.[BT5_CAP];
    bt5 = (bt5cap && bt5cap.value != null) ? bt5cap.value : null;
  } catch {}
  const temps = [tTop ? tTop.value : null, tHw ? tHw.value : null, bt5];
  setAvail(showerMinutes(temps));
  const cap = caps[STATUS_CAP];
  return cap ? cap.value : null;
}

function isActiveValue(val) {
  // measure_enum returnerer "Off" når av, "Increase 1h" / "Íncrease 1h" osv. når på
  if (val === null || val === undefined) return false;
  const s = String(val).toLowerCase();
  return s !== 'off' && s !== '0' && s !== 'false';
}

/* ── CONNECTION + INITIAL STATE READ ── */
async function connect(silent) {
  if (!hid || !hkey) {
    lock('Ikke konfigurert — trykk ⚙');
    if (!silent) setTimeout(openCfg, 300);
    return false;
  }
  if (!silent) setStatus('Kobler til…', null);
  try {
    const devs = await getDevices();
    devs_cache = devs; // cache for BT5-oppslag i readCapability

    let nibe;
    if (!devId || !capNm) {
      nibe = await findNibe(devs);
    } else {
      nibe = devs.find(d => d.id === devId);
      if (!nibe) {
        devId = ''; capNm = '';
        sv('hw_devId',''); sv('hw_cap','');
        nibe = await findNibe(devs);
      }
    }

    online = true;
    document.getElementById('tapbtn').disabled = false;

    // Finn PÅ/AV scripts (kun hvis vi ikke har dem fra før)
    if (!scriptOnId || !scriptOffId) {
      await findScripts();
    }

    // Les faktisk status fra pumpen og sett bilde deretter
    // MEN: ikke overstyr hvis vi nettopp har trykket — Modbus henger 30+ sek etter
    const inGrace = Date.now() - lastActionAt < GRACE_MS;
    try {
      const caps = nibe.capabilitiesObj || {};
      const capObj = caps[STATUS_CAP];
      const currentVal = capObj ? capObj.value : await readCapability();
      const isCurrentlyActive = isActiveValue(currentVal);

      // Dusjtid fra varmtvannstemperatur (BT7 topp + BT6 oppvarming + BT5 bunn)
      const tTop = caps[TEMP_CAP_TOP];
      const tHw  = caps[TEMP_CAP_HW];
      const bt5cap = devs.find(d => d.id === BT5_DEV_ID)?.capabilitiesObj?.[BT5_CAP];
      const bt5val = bt5cap?.value ?? null;
      setAvail(showerMinutes([tTop ? tTop.value : null, tHw ? tHw.value : null, bt5val]));

      if (!inGrace) {
        // Utenfor grace-perioden: stol på pumpen
        if (isCurrentlyActive) {
          // Hvis vi ikke har et lagret starttidspunkt (f.eks. aktivert utenfor
          // appen), forankre det nå slik at nedtellingen får et utgangspunkt.
          if (!lv('hw_started')) startCountdown();
          const left = remainingSec();
          setActive(true, left, true);
          setStatus(statusLabel(left), 'live');
        } else {
          clearCountdown();
          setActive(false, 0, true);
          setStatus('Lokalt tilkoblet · Klar', 'live');
        }
      } else {
        // Inne i grace-perioden: behold gjeldende visning, oppdater kun status-tekst
        setStatus(active ? statusLabel(cdsec) : 'Lokalt tilkoblet · Klar', 'live');
      }
    } catch {
      // Kunne ikke lese status — vis inaktiv som default
      setActive(false, 0, true);
      setStatus('Lokalt tilkoblet · Klar', 'live');
    }

    return true;
  } catch(e) {
    lock(
      e.message.includes('LAN') || e.message.includes('Tidsavbrudd')
        ? '📶 Ikke på hjemmenettverket'
        : '⚠ ' + e.message.slice(0, 34)
    );
    if (!silent) showErr(e.message);
    return false;
  }
}

function lock(reason) {
  online = false;
  document.getElementById('tapbtn').disabled = true;
  setStatus(reason || 'Låst', 'err');
}

/* ── STATUS POLLING — sjekk pumpe hvert 30. sekund ── */
let pollInt = null;
let availInt = null;   // egen timer: dusjtid beregnes hvert minutt
let lastActionAt = 0;   // tidspunkt for siste lokale trykk
let offReadCount = 0;   // hysterese: teller påfølgende "off"-avlesninger
const GRACE_MS = 150000; // 2,5 min — gi NIBE-appen tid til å polle pumpen

async function pollStatus() {
  if (!online || !devId) return;
  // Ikke overstyr rett etter en lokal handling — pumpens status henger etter
  if (Date.now() - lastActionAt < GRACE_MS) return;
  try {
    const val = await readCapability();
    const pumpActive = isActiveValue(val);

    if (pumpActive === active) { offReadCount = 0; return; }

    if (!pumpActive && active) {
      // Pumpen sier av, men vi viser på — krev to påfølgende avlesninger
      offReadCount++;
      if (offReadCount < 2) return;
    }
    offReadCount = 0;

    if (pumpActive) {
      if (!lv('hw_started')) startCountdown();
      const left = remainingSec();
      setActive(true, left, true);
      setStatus(statusLabel(left), 'live');
    } else {
      clearCountdown();
      setActive(false, 0, true);
      setStatus('Lokalt tilkoblet · Klar', 'live');
    }
  } catch {}
}

function startPolling() {
  if (pollInt) clearInterval(pollInt);
  pollInt = setInterval(pollStatus, 30000);
  // Dusjtid beregnes én gang per minutt, uavhengig av aktivert-tilstand
  if (availInt) clearInterval(availInt);
  refreshAvail();                       // beregn med en gang ved oppstart
  availInt = setInterval(refreshAvail, 60000);
}
function stopPolling() {
  if (pollInt) { clearInterval(pollInt); pollInt = null; }
  if (availInt) { clearInterval(availInt); availInt = null; }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { connect(true); startPolling(); }
  else { stopPolling(); }
}, {passive: true});

/* ── TAP HANDLER ── */
async function tap() {
  const next = !active;
  lastActionAt = Date.now();   // start grace-periode
  offReadCount = 0;

  // Lagre/nullstill starttidspunkt for nedtellingen
  if (next) startCountdown(); else clearCountdown();

  // Vis nytt bilde umiddelbart (med hysterese-forsinkelse på .1s i CSS)
  setActive(next, next ? HW_SEC : 0, false);

  if (!online) { openCfg(); return; }

  setLoading(true);
  try {
    await runScript(next ? scriptOnId : scriptOffId);
    // Suksess — tilstand er allerede korrekt
  } catch(e) {
    // Feil — reverter med kort forsinkelse (hysterese, unngår blink)
    clearTimeout(stateTO);
    stateTO = setTimeout(() => {
      document.body.classList.add('reverting');
      // Angre den persistente nedtellingen siden kommandoen feilet
      if (next) clearCountdown(); else startCountdown();
      setActive(!next, 0, false);
      setTimeout(() => document.body.classList.remove('reverting'), 400);
    }, 300);
    showErr(e.message);
    if (e.message.includes('LAN') || e.message.includes('Tidsavbrudd') || e.message.includes('ugyldig')) {
      lock('⚠ ' + e.message.slice(0, 34));
    }
  } finally {
    setLoading(false);
  }
}

/* ── STATE ── */
function setActive(on, sec, immediate) {
  active = on;
  if (immediate) {
    // Ingen CSS-delay — sett klasse direkte
    document.body.classList.remove('reverting');
  }
  document.body.classList.toggle('active', on);
  placeTap(); // oppdater trykksone for nytt bilde

  const tel = document.getElementById('ttxt');
  if (on) {
    cdsec = (sec == null) ? HW_SEC : sec;
    clearInterval(cdInt);
    tick(tel);
    cdInt = setInterval(() => tick(tel), 1000);
    try { navigator.vibrate && navigator.vibrate([30, 80, 30]); } catch {}
  } else {
    tel.textContent = '';
    clearInterval(cdInt); cdInt = null;
    try { navigator.vibrate && navigator.vibrate(20); } catch {}
  }
}

function tick(el) {
  if (cdsec <= 0) {
    clearInterval(cdInt); cdInt = null;
    el.textContent = '';
    // Ikke kall setActive(false) her — la pollStatus() bekrefte faktisk status
    // fra pumpen i stedet for å anta at den er av
    return;
  }
  const h = Math.floor(cdsec / 3600);
  const m = Math.floor((cdsec % 3600) / 60);
  const s = cdsec % 60;
  el.textContent = h
    ? h + 't ' + String(m).padStart(2,'0') + 'm ' + String(s).padStart(2,'0') + 's'
    : m + 'm ' + String(s).padStart(2,'0') + 's';
  cdsec--;
}

function setLoading(on) {
  document.body.classList.toggle('loading', on);
}

/* ── CONFIG UI ── */
function updCfg() {
  const pconn  = document.getElementById('pconn');
  const pfields = document.getElementById('pf');
  if (online) {
    pfields.classList.add('hidden');
    pconn.style.display = 'flex';
    document.getElementById('pcsub').textContent = hid;
  } else {
    pfields.classList.remove('hidden');
    pconn.style.display = 'none';
    document.getElementById('inp_hid').value = hid;
    document.getElementById('inp_key').value = hkey;
  }
}
function openCfg()  { updCfg(); document.getElementById('drawer').classList.add('open'); }
function closeCfg() { document.getElementById('drawer').classList.remove('open'); }
function bgClose(e) { if (e.target === document.getElementById('drawer')) closeCfg(); }
function resetCfg() { online = false; updCfg(); }

async function saveCfg() {
  hid  = document.getElementById('inp_hid').value.trim();
  hkey = document.getElementById('inp_key').value.trim();
  sv('hw_hid', hid); sv('hw_hkey', hkey);
  devId = ''; capNm = '';
  scriptOnId = ''; scriptOffId = '';
  sv('hw_devId',''); sv('hw_cap','');
  sv('hw_script_on',''); sv('hw_script_off','');
  showErr('');
  const ok = await connect(false);
  if (ok) closeCfg();
}

function showErr(msg) {
  // Config drawer feil
  const el = document.getElementById('perr');
  if (!msg) { el.classList.remove('show'); hideToast(); return; }
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 7000);
  // Synlig toast på skjermen
  showToast('⚠ ' + msg);
}

let toastTO = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTO);
  toastTO = setTimeout(hideToast, 8000);
}
function hideToast() {
  document.getElementById('toast').style.display = 'none';
}

async function dumpCaps() {
  const box = document.getElementById('pdump');
  box.style.display = 'block';
  box.textContent = 'Henter…';
  try {
    const devs = await getDevices();
    const nibe = devs.find(d =>
      d.name === 'Nibe S-Series' ||
      (d.name && d.name.toLowerCase().includes('nibe s'))
    );
    if (!nibe) { box.textContent = 'Fant ikke Nibe S-Series. Enheter: ' + devs.map(d=>d.name).join(', '); return; }
    const keys = Object.keys(nibe.capabilitiesObj || {}).sort();
    const hw   = keys.filter(k => /hot|water|onetime|increase/i.test(k));
    box.innerHTML =
      '<b style="color:#fbbf24">' + nibe.name + '</b><br><br>' +
      '<b style="color:#22c55e">HW (' + hw.length + '):</b><br>' + hw.join('<br>') +
      '<br><br><b style="color:#60a5fa">Alle (' + keys.length + '):</b><br>' + keys.join('<br>');
  } catch(e) {
    box.textContent = 'Feil: ' + e.message;
  }
}

/* ── INIT ── */
lock(hid ? 'Kobler til…' : 'Ikke konfigurert — trykk ⚙');
connect(false).then(() => startPolling());
</script>
