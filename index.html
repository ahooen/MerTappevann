<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Varmtvann"/>
<meta name="theme-color" content="#07101e"/>
<meta http-equiv="Content-Security-Policy" content="base-uri 'none'; object-src 'none'"/>
<meta name="referrer" content="no-referrer"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>Ekstra Varmtvann</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
/* ============================================================
   EKSTRA VARMTVANN — styrer NIBE S1256 via Homey Pro (lokalt API)
   Bilder: 1290x2796 (samme ratio som iPhone 16/17 Pro-skjerm)
   ============================================================ */
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --m:'DM Mono',ui-monospace,monospace;
  --bg:#07101e;
  --accent:#2e4d6a;            /* dempet blå — statusbar, etiketter */
  --ok:#22c55e;                /* grønn — tilkoblet/aktiv            */
  --err:#ef4444;               /* rød — feil                         */
  --avail-off:#c9d3dc;         /* dusjtid-tekst, matcher undertekst  */
  --avail-on:#35d435;          /* dusjtid-tekst i aktivert bilde     */
}
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{
  background:var(--bg);
  height:-webkit-fill-available;min-height:100svh;
  overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
body{padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}

/* ---- STATUSBAR (overlay øverst) ---- */
.sbar{
  position:absolute;top:var(--safe-top);left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  height:1.8rem;padding:.35rem .9rem;
}
.sleft{display:flex;align-items:center;gap:6px}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--accent);
      transition:background .5s,box-shadow .5s}
.sdot.live{background:var(--ok);box-shadow:0 0 7px #22c55e99}
.sdot.err{background:var(--err)}
.stxt{font-family:var(--m);font-size:10px;color:var(--accent);
      letter-spacing:.06em;transition:color .5s}
.stxt.live{color:var(--ok)}
.cfgbtn{background:none;border:none;cursor:pointer;color:var(--accent);
        font-size:17px;padding:8px 10px;line-height:1;touch-action:manipulation}

/* ---- BILDER (kryssfading mellom av/på) ---- */
.wrap{position:fixed;inset:0;overflow:hidden} /* inset:0 strekker til hele viewport */
.simg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center top;pointer-events:none;
  transition:opacity .9s ease;
}
.img-off{opacity:1}
.img-on{opacity:0}
body.active .img-off{opacity:0}
body.active .img-on{opacity:1}
body.reverting .simg{transition-duration:.3s}

/* ---- TRYKKSONE (plasseres av JS over knappen i bildet) ---- */
.tapbtn{
  position:absolute;border-radius:50%;border:none;cursor:pointer;
  background:transparent;z-index:10;touch-action:manipulation;
  -webkit-appearance:none;
}
.tapbtn:active{background:rgba(255,255,255,.06)}
.tapbtn:disabled{cursor:not-allowed}
body.loading .tapbtn{pointer-events:none}

/* ---- DUSJTID — "(NN min Varmtvann)" under underteksten ---- */
.avail{
  position:absolute;left:0;right:0;z-index:9;
  text-align:center;font-family:var(--m);
  font-size:clamp(13px,3.7vw,17px);letter-spacing:.02em;
  color:var(--avail-off);text-shadow:0 1px 6px rgba(0,0,0,.8);
  opacity:0;transition:opacity .6s,color .6s,top .6s;pointer-events:none;
}
.avail.show{opacity:1}
body.active .avail{color:var(--avail-on)}

/* ---- NEDTELLING — i det ledige feltet nederst i bildet ---- */
.tbar{
  position:absolute;left:0;right:0;
  text-align:center;z-index:15;pointer-events:none;
}
.ttxt{font-family:var(--m);font-size:13px;color:var(--ok);
      letter-spacing:.1em;text-shadow:0 1px 5px rgba(0,0,0,.9);
      transition:opacity .4s}

/* ---- LASTING — dimmet bilde + glidende linje i statusbar ---- */
body.loading .simg{filter:brightness(.8) saturate(.7);transition:filter .25s}
body.loading .sbar::after{
  content:'';position:absolute;left:0;bottom:-2px;height:2px;width:100%;
  background:linear-gradient(90deg,transparent,var(--ok),transparent);
  animation:loadbar 1s linear infinite;
}
@keyframes loadbar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---- FEIL-TOAST ---- */
.toast{
  display:none;position:fixed;z-index:200;
  top:calc(var(--safe-top) + 2.5rem);left:1rem;right:1rem;
  background:rgba(180,30,30,.95);border:1px solid rgba(255,100,100,.4);
  color:#fff;font-family:var(--m);font-size:12px;line-height:1.5;
  padding:.7rem 1rem;border-radius:10px;word-break:break-word;
}

/* ---- CONFIG DRAWER ---- */
.drawer{
  position:fixed;inset:0;z-index:100;visibility:hidden;opacity:0;
  background:rgba(7,16,30,.78);                       /* fallback */
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  transition:opacity .3s,visibility .3s;
}
.drawer.open{visibility:visible;opacity:1}
.panel{
  position:absolute;left:0;right:0;bottom:0;
  background:rgba(10,20,36,.92);                      /* fallback */
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:18px 18px 0 0;border-top:1px solid rgba(255,255,255,.07);
  padding:.7rem 1.3rem calc(var(--safe-bot) + 1.4rem);
  transform:translateY(100%);transition:transform .3s ease;
}
.drawer.open .panel{transform:none}
.ph{width:36px;height:4px;border-radius:2px;margin:0 auto .9rem;
    background:rgba(255,255,255,.18)}
.pt{font-family:var(--m);font-size:10px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:.85rem}
.pconn{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.pcdot{width:8px;height:8px;border-radius:50%;background:var(--ok);
       box-shadow:0 0 8px #22c55e88;flex-shrink:0}
.pctxt{flex:1;color:#dbe7f4;font-family:var(--m);font-size:13px}
.pcsub{display:block;color:var(--accent);font-size:10px;margin-top:2px}
.pcreset{background:none;border:1px solid rgba(255,255,255,.08);border-radius:7px;
         color:var(--accent);font-family:var(--m);font-size:9px;padding:.45rem .7rem;
         cursor:pointer;-webkit-appearance:none;white-space:nowrap;flex-shrink:0;
         touch-action:manipulation}
.pf.hidden{display:none}
.pfield{margin-bottom:.8rem}
.plbl{font-family:var(--m);font-size:9px;color:var(--accent);
      letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem}
.pinp{
  width:100%;padding:.7rem .8rem;border-radius:9px;font-size:16px; /* 16px hindrer iOS-zoom */
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:#e8f1fa;font-family:var(--m);-webkit-appearance:none;outline:none;
}
.pinp:focus{border-color:var(--accent)}
.pbtn{
  width:100%;padding:.8rem;border:none;border-radius:10px;cursor:pointer;
  background:#16405f;color:#cfe6f7;font-family:var(--m);font-size:13px;
  letter-spacing:.06em;-webkit-appearance:none;touch-action:manipulation;
}
.perr{display:none;color:#ff9d9d;font-family:var(--m);font-size:11px;
      margin-top:.6rem;line-height:1.5}
.perr.show{display:block}
.pnote{margin-top:1rem;color:#54708c;font-size:10.5px;font-family:var(--m);
       line-height:1.7}
.pnote a{color:#7fa8c9}
.pnote code{color:#9fc0da}

@media(prefers-reduced-motion:reduce){
  .simg,.ttxt,.avail{transition:none}
  body.loading .sbar::after{animation:none}
}
</style>
</head>
<body>
<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
              background:#07101e;color:#9fb4cc;font-family:ui-monospace,monospace;
              font-size:14px;text-align:center;padding:2rem;z-index:999;line-height:1.6">
    Denne appen krever JavaScript.<br>Aktiver JavaScript for å styre varmtvannet.
  </div>
</noscript>

<div class="sbar">
  <div class="sleft">
    <div class="sdot" id="sdot"></div>
    <span class="stxt" id="stxt">Kobler til…</span>
  </div>
  <button class="cfgbtn" id="cfgbtn" aria-label="Innstillinger">⚙</button>
</div>

<div class="wrap" id="wrap">
  <img class="simg img-off" id="imgOff" src="img-off.webp?v=3" decoding="async"
       alt="Lite dusjvann tilgjengelig — trykk på knappen for ekstra varmtvann" draggable="false"/>
  <img class="simg img-on" src="img-on.webp?v=3" decoding="async"
       alt="Mye dusjvann tilgjengelig — ekstra varmtvann er aktivert" draggable="false"/>
  <button class="tapbtn" id="tapbtn" aria-label="Slå av/på ekstra varmtvann" aria-pressed="false"></button>
  <div class="avail" id="avail"></div>
</div>

<div class="tbar" id="tbar"><span class="ttxt" id="ttxt"></span></div>
<div class="toast" id="toast"></div>

<div class="drawer" id="drawer">
  <div class="panel">
    <div class="ph"></div>
    <div class="pt">Homey · Tilkobling</div>
    <div class="pconn" id="pconn" style="display:none">
      <div class="pcdot"></div>
      <div class="pctxt">Tilkoblet og klar<span class="pcsub" id="pcsub"></span></div>
      <button class="pcreset" id="pcreset">Endre</button>
    </div>
    <div class="pf" id="pf">
      <div class="pfield">
        <div class="plbl">Homey IP</div>
        <input class="pinp" id="inp_hid" type="text" inputmode="url" autocomplete="off"
               spellcheck="false" autocorrect="off" autocapitalize="none"
               placeholder="192.168.1.200"/>
      </div>
      <div class="pfield">
        <div class="plbl">API Key (Devices + HomeyScript)</div>
        <input class="pinp" id="inp_key" type="password"
               autocomplete="current-password" placeholder="Lim inn API Key"/>
      </div>
      <button class="pbtn" id="psave">Lagre og test tilkobling</button>
      <div class="perr" id="perr"></div>
    </div>
    <div class="pnote">Build 2025-06 · v3<br>
      Lokal LAN-tilkobling kun. Homey IP: <code>192.168.1.200</code><br>
      API Key: <a href="https://my.homey.app" target="_blank" rel="noopener">my.homey.app</a>
      → Innstillinger → API Keys → <em>Devices + HomeyScript</em>
    </div>
  </div>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   OVERSIKT
   1. Konstanter & lagring     5. Homey API (fetch + scripts)
   2. Trykksone-posisjonering  6. Tilkobling & polling
   3. Dusjtid-beregning        7. Trykk-håndtering & nedtelling
   4. Status-UI                8. Config-skuff & init
   ════════════════════════════════════════════════════════════ */

/* ── 1. KONSTANTER & LAGRING ─────────────────────────────── */
const $  = id => document.getElementById(id);
const lv = k => { try { return localStorage.getItem(k); } catch { return null; } };
const sv = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
const rm = k => { try { localStorage.removeItem(k); } catch {} };

let hid  = lv('hw_hid')  || '192.168.1.200';   // Homey IP/host
let hkey = lv('hw_hkey') || '';                 // API Key
let devId = lv('hw_devId') || '';               // Nibe device-ID (caches)

const STATUS_CAP   = 'measure_enum_NIBE.h697_onetimeincrease_hotwater'; // pumpens faktiske status
const TEMP_CAP_TOP = 'measure_temperature_NIBE.i8_warmwater_top';       // BT7 topp
const TEMP_CAP_HW  = 'measure_temperature_NIBE.i9_hot_water';           // BT6 kontrollsensor
const BT5_DEV_ID   = '268d71a6-f117-4f0c-860e-c37377e7d1f9';            // egen DeviceCapabilities-enhet
const BT5_CAP      = 'devicecapabilities_number.number1';               // BT5 bunn

const SCRIPT_ON  = 'tappevann_paa';   // HomeyScript-navn
const SCRIPT_OFF = 'tappevann_av';

const HW_SEC   = 3600;     // aktivering varer 1 time (pumpen stanser selv)
const GRACE_MS = 150000;   // 150 s = 2 min 30 s — Modbus-status henger etter et trykk
const POLL_MS  = 30000;    // statussjekk + dusjtid hvert 30. sek

/* ── 2. TRYKKSONE — målt opp mot knappen i bildene ──────────
   Bildene er 1290x2796 og vises med object-fit:cover, center top.
   Knappens senter og radius (andel av bildebredde/-høyde):
     AV-bildet: senter (0.510, 0.605), radius 0.235·bredde
     PÅ-bildet: senter (0.505, 0.657), radius 0.245·bredde
   Dusjtid-teksten står rett under underteksten øverst (~15 % høyde). */
const IMG_W = 1290, IMG_H = 2796;
const BTN = {
  off: { x: 0.510, y: 0.605, r: 0.235 },
  on:  { x: 0.505, y: 0.657, r: 0.245 },
};
const AVAIL_Y = 0.150;   // likt i begge bildene
const TBAR_Y  = 0.935;   // nedtelling: ledig mørkt felt under tekstboksen

function placeTap() {
  const wr = $('wrap').getBoundingClientRect();
  const s  = wr.width / IMG_W;                 // skala (cover fyller alltid bredden)
  const p  = active ? BTN.on : BTN.off;
  const r  = Math.max(22, IMG_W * s * p.r);    // min 44x44 px (Apple HIG)
  const cx = IMG_W * s * p.x;
  const cy = IMG_H * s * p.y;
  const b  = $('tapbtn');
  b.style.left   = (cx - r) + 'px';
  b.style.top    = (cy - r) + 'px';
  b.style.width  = b.style.height = (r * 2) + 'px';
  $('avail').style.top = (IMG_H * s * AVAIL_Y) + 'px';
  $('tbar').style.top  = (IMG_H * s * TBAR_Y)  + 'px';
}
addEventListener('load',   placeTap, {passive:true});
addEventListener('resize', placeTap, {passive:true});
$('imgOff').addEventListener('load', placeTap, {once:true});

/* ── 3. DUSJTID — sjiktet tankmodell forankret i EN16147 ────
   Kilder (NIBE produktblad S1256 + installatørhåndbok S-serien):
   • Berederen i S1256-8 EM rommer 178 liter.
   • Sertifisert tappevolum 40 °C (V40, EN16147) ved full lading:
     235 / 250 / 275 l i komfort Lite / Middels / Stor.
   • BT7 sitter i toppen, BT6 i midten av berederen; (NIBE-)BT5 er
     en valgfri giver MELLOM BT6 og BT7.

   Modell: tanken deles i fire like sjikt. Ved tapping presses varmt
   vann ut i toppen mens kaldt fyller på i bunnen — et sjikt under
   dusjtemperatur (40 °C) kan derfor ALDRI tappes som dusjvann og
   bidrar med null. Sjikt ≥40 °C bidrar med blandevolum
   V/4 · (T − T_kald)/(40 − T_kald). Summen er liter 40 °C-vann;
   delt på dusjens vannmengde gir det minutter.
   Kontroll mot fasit: full tank i Middels (~52 °C jevnt) gir
   178·(52,1−10)/30 = 250 l — nøyaktig NIBEs sertifiserte V40. */
const TANK_L     = 178;   // bereder, S1256-8 EM
const T_COLD     = 10;    // kaldtvann inn (EN16147-referanse)
const T_SHOWER   = 40;    // ferdig blandet dusjtemperatur
const FLOW_LPM   = 10.2;  // kalibrert mot NIBE-appen (234 l → 23 min ved 48/51/53 °C)
const EXTRA_POS  = 'mid'; // myUplink 10894 = «Hot water start (BT5)» — sitter MELLOM BT6 og BT7
                          // alternativ: 'bottom' hvis du senere får egen giver i bunnen

function showerMinutes({ bt7, bt5, bt6 }) {
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  bt7 = num(bt7); bt5 = num(bt5); bt6 = num(bt6);
  if (bt7 === null && bt6 === null) return null;   // ingen data
  if (bt7 === null) bt7 = bt6;                     // tåler én død giver
  if (bt6 === null) bt6 = bt7;

  // Fire sjikt, topp → bunn. Uten bunngiver ekstrapoleres gradienten
  // BT-mid→BT6 nedover, avgrenset til [T_COLD, BT6].
  const tMid = (EXTRA_POS === 'mid' && bt5 !== null) ? bt5 : (bt7 + bt6) / 2;
  const tBot = (EXTRA_POS === 'bottom' && bt5 !== null)
             ? bt5
             : Math.min(bt6, Math.max(T_COLD, bt6 - (tMid - bt6)));

  let liters40 = 0;
  for (const T of [bt7, tMid, bt6, tBot])
    if (T >= T_SHOWER)
      liters40 += (TANK_L / 4) * (T - T_COLD) / (T_SHOWER - T_COLD);

  return Math.round(liters40 / FLOW_LPM);
}
function setAvail(mins) {
  const el = $('avail');
  if (mins === null) { el.classList.remove('show'); el.textContent = ''; return; }
  el.textContent = '(' + mins + ' min Varmtvann)';
  el.classList.add('show');
}
/* Plukker temperaturer ut av et capabilities-objekt + BT5 fra cache. */
function updateAvailFrom(caps) {
  const bt5 = devsCache.find(d => d.id === BT5_DEV_ID)
                ?.capabilitiesObj?.[BT5_CAP]?.value ?? null;
  setAvail(showerMinutes({
    bt7: caps[TEMP_CAP_TOP]?.value ?? null,
    bt5,
    bt6: caps[TEMP_CAP_HW]?.value ?? null,
  }));
}

/* ── 4. STATUS-UI ───────────────────────────────────────────── */
function statusLabel(sec) {
  if (sec == null || sec >= HW_SEC - 60) return 'Aktivert · 1 time';
  return 'Aktivert · ' + Math.max(0, Math.round(sec/60)) + ' min igjen';
}
function setStatus(txt, state) {        // state: 'live' | 'err' | null
  $('stxt').textContent = txt;
  $('sdot').className = 'sdot' + (state ? ' '+state : '');
  $('stxt').className = 'stxt' + (state === 'live' ? ' live' : '');
  $('sdot').parentElement.style.display = (state === 'live') ? 'none' : '';
}
function lock(reason) {
  online = false;
  $('tapbtn').disabled = true;
  setStatus(reason || 'Låst', 'err');
}
let toastTO = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTO);
  toastTO = setTimeout(() => t.style.display = 'none', 8000);
}
function showErr(msg) {
  const el = $('perr');
  if (!msg) { el.classList.remove('show'); $('toast').style.display='none'; return; }
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 7000);
  showToast('⚠ ' + msg);
}

/* ── 5. HOMEY API ───────────────────────────────────────────── */
function base() {
  const h = hid.trim();
  if (!h) return null;
  if (h.startsWith('http')) return h.replace(/\/$/, '');
  // Ren IP → Homeys lokale HTTPS-alias (unngår mixed content fra GitHub Pages)
  if (/^\d+\.\d+\.\d+\.\d+$/.test(h))
    return 'https://' + h.replace(/\./g, '-') + '.homey.homeylocal.com';
  return 'http://' + h;
}
async function apiFetch(path, opts) {
  const b = base();
  if (!b) throw new Error('Ingen IP konfigurert');
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), 5000);
  try {
    return await fetch(b + path, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + hkey, ...(opts?.headers) },
      signal: ac.signal,
    });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Tidsavbrudd — er du hjemme?'
                                            : 'Ikke tilgjengelig på LAN');
  } finally { clearTimeout(t); }
}

let devsCache = [];
async function getDevices() {
  if (!hkey) throw new Error('Mangler API Key');
  const r = await apiFetch('/api/manager/devices/device');
  if (r.status === 401) throw new Error('API Key ugyldig (401)');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return Object.values(await r.json());
}
function findNibe(devs) {
  // Eksakt navn — løst søk plukket feilaktig «Nibe Supply Line»
  const d = devs.find(d => d.name === 'Nibe S-Series');
  if (!d) throw new Error('Fant ikke Nibe S-Series i Homey');
  devId = d.id; sv('hw_devId', devId);
  return d;
}

/* HomeyScript: tappevann_paa setter engangsøkning (1 t), tappevann_av avbryter. */
let scriptOnId  = lv('hw_script_on')  || '';
let scriptOffId = lv('hw_script_off') || '';
async function findScripts() {
  const r = await apiFetch('/api/app/com.athom.homeyscript/script');
  if (r.status === 403) throw new Error('API Key mangler HomeyScript-tilgang');
  if (!r.ok) throw new Error('Kunne ikke hente scripts (HTTP ' + r.status + ')');
  const list = Object.values(await r.json());
  const norm = s => (s || '').trim().toLowerCase().replace(/\s+/g, '_');
  const find = name => list.find(s => norm(s.name) === name || norm(s.id) === name);
  const on = find(SCRIPT_ON), off = find(SCRIPT_OFF);
  if (!on)  throw new Error('Fant ikke script "' + SCRIPT_ON + '"');
  if (!off) throw new Error('Fant ikke script "' + SCRIPT_OFF + '"');
  scriptOnId  = on.id;  sv('hw_script_on',  scriptOnId);
  scriptOffId = off.id; sv('hw_script_off', scriptOffId);
}
async function runScript(id) {
  const r = await apiFetch(
    '/api/app/com.athom.homeyscript/script/' + encodeURIComponent(id) + '/run',
    { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
  let body=''; try { body = await r.text(); } catch {}
  if (!r.ok)
    throw new Error('Script feilet HTTP ' + r.status + ': ' + body.slice(0,60));
  try {                       // HomeyScript kan svare 200 med success:false
    const j = JSON.parse(body);
    if (j && j.success === false)
      throw new Error('Script kastet feil: ' + String(j.returns ?? '').slice(0,60));
  } catch (e) { if (String(e.message).startsWith('Script kastet')) throw e; }
}

/* Leser pumpens status og oppdaterer dusjtid. BT5-enheten hentes
   parallelt så bunntemperaturen er like fersk som resten. */
async function readStatus() {
  const [r, rBt5] = await Promise.all([
    apiFetch('/api/manager/devices/device/' + devId),
    apiFetch('/api/manager/devices/device/' + BT5_DEV_ID).catch(() => null),
  ]);
  if (!r.ok) return null;
  if (rBt5?.ok) {
    const d = await rBt5.json();
    const i = devsCache.findIndex(x => x.id === BT5_DEV_ID);
    i >= 0 ? devsCache[i] = d : devsCache.push(d);
  }
  const caps = (await r.json()).capabilitiesObj || {};
  updateAvailFrom(caps);
  return caps[STATUS_CAP]?.value ?? null;
}
const isOn = v => v != null && !['off','0','false'].includes(String(v).toLowerCase());

/* ── 6. TILKOBLING & POLLING ────────────────────────────────── */
let online = false;
let active = false;          // visuell tilstand (hvilket bilde vises)
let lastActionAt = 0;        // start på grace-perioden etter lokalt trykk
let offReads = 0;            // hysterese: krev 2 "off"-avlesninger før revert

/* Persistert nedtelling: lagrer starttidspunkt så gjenstående tid
   overlever at appen lukkes og åpnes igjen. */
const cdStart = () => sv('hw_started', String(Date.now()));
const cdClear = () => rm('hw_started');
function cdRemaining() {
  const t = parseInt(lv('hw_started') || '', 10);
  if (!t) return HW_SEC;
  return Math.max(0, HW_SEC - Math.floor((Date.now() - t) / 1000));
}

/* Synkroniserer UI mot pumpens status (felles for connect og polling). */
function applyPumpState(pumpOn) {
  if (pumpOn) {
    if (!lv('hw_started')) cdStart();   // aktivert utenfor appen → forankre nå
    setActive(true, true);
    setStatus(statusLabel(cdRemaining()), 'live');
  } else {
    cdClear();
    setActive(false, true);
    setStatus('Lokalt tilkoblet · Klar', 'live');
  }
}

async function connect(silent) {
  if (!hid || !hkey) {
    lock('Ikke konfigurert — trykk ⚙');
    if (!silent) setTimeout(openCfg, 300);
    return false;
  }
  if (!silent) setStatus('Kobler til…', null);
  try {
    const devs = await getDevices();
    devsCache = devs;
    let nibe = devId && devs.find(d => d.id === devId);
    if (!nibe) nibe = findNibe(devs);

    online = true;
    $('tapbtn').disabled = false;
    if (!scriptOnId || !scriptOffId) await findScripts();

    const caps = nibe.capabilitiesObj || {};
    updateAvailFrom(caps);

    if (Date.now() - lastActionAt >= GRACE_MS) {
      applyPumpState(isOn(caps[STATUS_CAP]?.value));
    } else {
      // Innenfor grace: behold gjeldende visning, oppdater kun statusteksten
      setStatus(active ? statusLabel(cdRemaining()) : 'Lokalt tilkoblet · Klar', 'live');
    }
    return true;
  } catch (e) {
    const net = /LAN|Tidsavbrudd/.test(e.message);
    lock(net ? '📶 Ikke på hjemmenettverket' : '⚠ ' + e.message.slice(0,34));
    if (!silent) showErr(e.message);
    return false;
  }
}

async function pollStatus() {
  if (!online || !devId) return;
  try {
    const pumpOn = isOn(await readStatus());   // oppdaterer også dusjtid-teksten
    if (Date.now() - lastActionAt < GRACE_MS) return;  // ikke overstyr ferskt trykk
    if (pumpOn === active) { offReads = 0; return; }
    if (!pumpOn && active && ++offReads < 2) return;   // hysterese mot flimring
    offReads = 0;
    applyPumpState(pumpOn);
  } catch {}
}

let pollInt = null;
function startPolling() {
  stopPolling();
  pollInt = setInterval(pollStatus, POLL_MS);
  pollStatus();                                // les med en gang ved oppstart
}
function stopPolling() {
  clearInterval(pollInt); pollInt = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling();
  else { connect(true); startPolling(); }
}, {passive:true});

/* ── 7. TRYKK & NEDTELLING ──────────────────────────────────── */
let cdInt = null, revertTO = null;

async function tap() {
  const next = !active;
  lastActionAt = Date.now();
  offReads = 0;
  next ? cdStart() : cdClear();
  setActive(next, false);                      // optimistisk UI

  if (!online) { openCfg(); return; }
  document.body.classList.add('loading');
  try {
    await runScript(next ? scriptOnId : scriptOffId);
  } catch (e) {
    // Feilet → reverter bilde og nedtelling med kort forsinkelse (unngår blink)
    clearTimeout(revertTO);
    revertTO = setTimeout(() => {
      document.body.classList.add('reverting');
      next ? cdClear() : cdStart();
      setActive(!next, false);
      lastActionAt = 0;   // kommandoen feilet — slipp polling til igjen straks
      setTimeout(() => document.body.classList.remove('reverting'), 400);
    }, 300);
    showErr(e.message);
    if (/LAN|Tidsavbrudd|ugyldig/.test(e.message)) lock('⚠ ' + e.message.slice(0,34));
  } finally {
    document.body.classList.remove('loading');
  }
}

function setActive(on, immediate) {
  active = on;
  if (immediate) document.body.classList.remove('reverting');
  document.body.classList.toggle('active', on);
  $('tapbtn').setAttribute('aria-pressed', on);
  placeTap();                                   // knappen flytter seg mellom bildene
  const el = $('ttxt');
  clearInterval(cdInt); cdInt = null;
  if (on) {
    tick(el);
    cdInt = setInterval(() => tick(el), 1000);
    try { navigator.vibrate?.([30,80,30]); } catch {}
  } else {
    el.textContent = '';
    try { navigator.vibrate?.(20); } catch {}
  }
}
/* Tiden beregnes fra lagret starttidspunkt hvert sekund — riktig selv om
   iOS pauser timeren mens appen ligger i bakgrunnen. */
function tick(el) {
  const left = cdRemaining();
  if (left <= 0) {        // la pollStatus bekrefte at pumpen faktisk er av
    clearInterval(cdInt); cdInt = null;
    el.textContent = '';
    return;
  }
  const m = Math.floor(left/60), s = left % 60;
  el.textContent = m + 'm ' + String(s).padStart(2,'0') + 's';
}

/* ── 8. CONFIG-SKUFF & INIT ─────────────────────────────────── */
function validHost(h) {
  if (!h) return false;
  if (/^https?:\/\//.test(h)) { try { new URL(h); return true; } catch { return false; } }
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h)) return h.split('.').every(o => +o <= 255);
  return /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$/i.test(h);
}
function updCfg(forceForm) {
  const showForm = forceForm || !online;
  $('pf').classList.toggle('hidden', !showForm);
  $('pconn').style.display = showForm ? 'none' : 'flex';
  if (showForm) { $('inp_hid').value = hid; $('inp_key').value = hkey; }
  else $('pcsub').textContent = hid;
}
function openCfg() {
  updCfg();
  $('drawer').classList.add('open');
  setTimeout(() => { if (!online) $('inp_hid').focus(); }, 250);
}
function closeCfg() { $('drawer').classList.remove('open'); }
async function saveCfg() {
  hid  = $('inp_hid').value.trim();
  hkey = $('inp_key').value.trim();
  if (!validHost(hid)) { showErr('Ugyldig IP-adresse eller vertsnavn'); return; }
  if (!hkey)           { showErr('API Key mangler'); return; }
  sv('hw_hid', hid); sv('hw_hkey', hkey);
  devId = scriptOnId = scriptOffId = '';
  ['hw_devId','hw_script_on','hw_script_off'].forEach(rm);
  showErr('');
  if (await connect(false)) closeCfg();
}

$('cfgbtn').addEventListener('click', openCfg);
$('tapbtn').addEventListener('click', tap);
$('pcreset').addEventListener('click', () => updCfg(true));
$('psave').addEventListener('click', saveCfg);
$('drawer').addEventListener('click', e => { if (e.target === $('drawer')) closeCfg(); });

lock(hid ? 'Kobler til…' : 'Ikke konfigurert — trykk ⚙');
connect(false).then(() => startPolling());
</script>
</body>
</html>
